name: taskflow
services:
  db:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Create .env from .env.example}
      POSTGRES_USER: ${POSTGRES_USER:?Create .env from .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    image: taskflow-backend:1.0.0
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      DB_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SESSION_HOURS: ${SESSION_HOURS:-24}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000}
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 5s
      timeout: 3s
      retries: 15
  frontend:
    image: taskflow-frontend:1.0.0
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
      VITE_NOTIFICATION_POLL_MS: ${VITE_NOTIFICATION_POLL_MS:-5000}
    ports:
      - '127.0.0.1:5173:5173'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://localhost:5173").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))']
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
