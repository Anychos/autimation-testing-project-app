[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taskflow-notification-service"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "SQLAlchemy==2.0.58",
    "psycopg[binary]==3.3.9",
    "alembic==1.20.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "email-validator==2.4.0",
    "pika==1.3.2",
    "prometheus-client==0.23.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.13.3", "jsonschema==4.25.1"]

[tool.setuptools.package-data]
notification_service = ["templates/*.html", "templates/*.txt"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
