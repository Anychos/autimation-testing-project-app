global:
  scrape_interval: SCRAPE_INTERVAL
  scrape_timeout: 4s
  evaluation_interval: SCRAPE_INTERVAL

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: backend
    static_configs:
      - targets: ['backend:8000']
  - job_name: notification-api
    static_configs:
      - targets: ['notification-api:8000']
  - job_name: outbox
    static_configs:
      - targets: ['outbox-publisher:9101']
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: notification-postgres
    static_configs:
      - targets: ['notification-postgres-exporter:9187']
  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_project]
        regex: taskflow-performance
        action: keep
  - job_name: notification-worker
    dns_sd_configs:
      - names: [notification-worker]
        type: A
        port: 9102
        refresh_interval: 5s
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count, queue_delivery_metrics]
      vhost: [taskflow-performance]
    static_configs:
      - targets: ['rabbitmq:15692']
